      <stop offset="0%" stop-color="#0c0c0e"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
  </defs>

  <!-- Container Squircle with Precision Border -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="none" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1"/>

  <!-- Dark Polarity Foundation Disc -->
