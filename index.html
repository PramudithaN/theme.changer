<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>theme.changer | Fluid GPU-Accelerated Theme Transitions</title>
    <meta name="description" content="theme.changer is a WebGL2 transition engine that replaces abrupt theme flips with fluid procedural ink bleed, watercolor, smoke, ember, and ripple shaders." />
    <!-- Paint the correct background before any JS/CSS arrives: no white flash. -->
    <style>
      html[data-theme='light'] { background: #fafafa; }
      html[data-theme='dark'] { background: #09090b; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
